# Site Settings
title: Koffee and Kode
description: A blog about code, tech, and everything in between
url: https://gautham-surakanti.github.io
baseurl: /koffee-and-kode

# Author
author:
  name: Gautham Surakanti

# Build settings
plugins:
  - jekyll-feed
  - jekyll-sitemap

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

